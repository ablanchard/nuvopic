AWSTemplateFormatVersion: "2010-09-09"
Description: Grants NuvoPic read-only access to one existing Amazon S3 bucket.

Parameters:
  BucketName:
    Type: String
    Description: Existing S3 bucket containing your photos.
    AllowedPattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
  ExternalId:
    Type: String
    Description: Unique NuvoPic connection identifier used when assuming the role.
    MinLength: 2
    MaxLength: 1224
  NuvoPicPrincipalArn:
    Type: String
    Description: NuvoPic AWS principal allowed to assume the read-only role.
    AllowedPattern: "^arn:aws:iam::[0-9]{12}:(role|user)/[A-Za-z0-9+=,.@_/-]+$"
  RoleName:
    Type: String
    Description: Unique name generated by NuvoPic for this connection.
    AllowedPattern: "^[A-Za-z0-9+=,.@_-]{1,64}$"

Resources:
  NuvoPicReadRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: !Sub "Read-only access for NuvoPic to ${BucketName}"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref NuvoPicPrincipalArn
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      Policies:
        - PolicyName: NuvoPicReadOnlyBucket
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadBucketMetadataAndListObjects
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: !Sub "arn:aws:s3:::${BucketName}"
              - Sid: ReadPhotoObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "arn:aws:s3:::${BucketName}/*"

Outputs:
  RoleArn:
    Description: IAM role NuvoPic will assume using temporary credentials.
    Value: !GetAtt NuvoPicReadRole.Arn
  Bucket:
    Description: S3 bucket available to NuvoPic.
    Value: !Ref BucketName
